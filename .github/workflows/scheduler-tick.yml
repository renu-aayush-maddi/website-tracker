# Backup trigger for scheduled checks. The primary trigger should be cron-job.org
# (every minute); GitHub's scheduled workflows run at most every 5 minutes and
# are often delayed, so this exists only as a safety net. Overlapping triggers
# are safe: each monitor is claimed with a lease.
#
# Repository secrets required:
#   TICK_URL          https://<your-api>.onrender.com/api/internal/scheduler/tick
#   SCHEDULER_SECRET  same value as the API's SCHEDULER_SECRET
name: Scheduler tick (backup)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger scheduler
        env:
          TICK_URL: ${{ secrets.TICK_URL }}
          SCHEDULER_SECRET: ${{ secrets.SCHEDULER_SECRET }}
        run: |
          if [ -z "$TICK_URL" ] || [ -z "$SCHEDULER_SECRET" ]; then
            echo "TICK_URL / SCHEDULER_SECRET secrets are not set; skipping."
            exit 0
          fi
          # Free Render services can take ~60 s to wake, hence the generous timeout and retry.
          curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 10 \
            -X POST -H "Authorization: Bearer ${SCHEDULER_SECRET}" "${TICK_URL}?source=github-actions"
